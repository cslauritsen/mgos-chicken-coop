# ESPHome port of the Mongoose OS chicken coop firmware (see ../README.md for wiring).
# Hardware: ESP8266 LoLin NodeMCU, DHT22, LDR on A0, two reed switches, H-bridge motor.
substitutions:
  name: chicken-coop
  friendly_name: Chicken Coop
  # pins (same as mos.yml defaults)
  dht_pin: GPIO0
  door_open_contact_pin: GPIO13
  door_closed_contact_pin: GPIO12
  door_raise_pin: GPIO4
  door_lower_pin: GPIO5
  # behaviour (same as mos.yml defaults)
  door_motor_active_seconds: 10s   # time.door_motor_active_seconds: motor run-time backstop
  publish_interval: 60s            # time.mqttPubInterval
  # sun schedule: sun elevation at which to open (morning) / close (evening).
  # -0.833 deg is sunrise/sunset; -6 deg is civil twilight (about 30 min after sunset).
  open_elevation: "-0.833°"
  close_elevation: "-6°"
  open_elevation_deg: "-0.833"   # same values as above, as plain numbers
  close_elevation_deg: "-6.0"
  timezone: America/New_York

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: nodemcuv2

logger:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Same broker as the old firmware. Home Assistant discovery is on by default
# (prefix `homeassistant`). To use the native HA API instead, add `api:` and
# drop this block.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password

# Replaces the /rpc/NorthDoor.Open|Close HTTP calls, e.g.
#   curl -X POST http://<ip>/cover/north_door/open
web_server:
  port: 80

# Clock for the sun schedule; set once at boot, then kept by the ESP.
time:
  - platform: sntp
    timezone: ${timezone}
    # After a reboot or power cut a sunrise/sunset may have been missed, so put the
    # door where it should be once the clock is valid.
    on_time_sync:
      # only the first sync after boot; later resyncs must not override manual moves
      - if:
          condition:
            and:
              - switch.is_on: sun_schedule
              - lambda: |-
                  static bool first = true;
                  const bool was_first = first;
                  first = false;
                  return was_first;
          then:
            - if:
                condition:
                  lambda: 'return id(sun_sun).elevation() > ${open_elevation_deg};'
                then:
                  - cover.open: north_door
            - if:
                condition:
                  lambda: 'return id(sun_sun).elevation() < ${close_elevation_deg};'
                then:
                  - cover.close: north_door

sun:
  id: sun_sun
  latitude: !secret latitude
  longitude: !secret longitude
  on_sunrise:
    - elevation: ${open_elevation}
      then:
        - if:
            condition:
              switch.is_on: sun_schedule
            then:
              - cover.open: north_door
  on_sunset:
    - elevation: ${close_elevation}
      then:
        - if:
            condition:
              switch.is_on: sun_schedule
            then:
              - cover.close: north_door

switch:
  # Turn off to pause the sunrise/sunset open/close (e.g. while cleaning the coop).
  - platform: template
    id: sun_schedule
    name: Sun Schedule
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  # Motor H-bridge. Both outputs are forced LOW on boot and may never be HIGH
  # together (interlock turns the other one off first).
  - platform: gpio
    id: door_raise
    pin: ${door_raise_pin}
    restore_mode: ALWAYS_OFF
    interlock: [door_lower]
    internal: true
  - platform: gpio
    id: door_lower
    pin: ${door_lower_pin}
    restore_mode: ALWAYS_OFF
    interlock: [door_raise]
    internal: true

binary_sensor:
  # Reed switches are wired to ground with pull-ups: pin LOW == contact made.
  - platform: gpio
    id: door_open_contact
    name: North Door Fully Open
    pin:
      number: ${door_open_contact_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    # Keep the cover in step when the door is moved by the manual rocker switch
    # (the cover ignores the reed switches while it is idle).
    on_press:
      - lambda: !lambda |-
          if (id(north_door).current_operation == cover::COVER_OPERATION_IDLE) {
            id(north_door).position = cover::COVER_OPEN;
            id(north_door).publish_state();
          }
    on_release:
      - lambda: !lambda |-
          if (id(north_door).current_operation == cover::COVER_OPERATION_IDLE) {
            id(north_door).position = 0.5f;
            id(north_door).publish_state();
          }
  - platform: gpio
    id: door_closed_contact
    name: North Door Fully Closed
    pin:
      number: ${door_closed_contact_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      - lambda: !lambda |-
          if (id(north_door).current_operation == cover::COVER_OPERATION_IDLE) {
            id(north_door).position = cover::COVER_CLOSED;
            id(north_door).publish_state();
          }
    on_release:
      - lambda: !lambda |-
          if (id(north_door).current_operation == cover::COVER_OPERATION_IDLE) {
            id(north_door).position = 0.5f;
            id(north_door).publish_state();
          }

cover:
  - platform: endstop
    id: north_door
    name: North Door
    device_class: door
    open_action:
      - switch.turn_on: door_raise
    open_endstop: door_open_contact
    open_duration: ${door_motor_active_seconds}
    close_action:
      - switch.turn_on: door_lower
    close_endstop: door_closed_contact
    close_duration: ${door_motor_active_seconds}
    stop_action:
      - switch.turn_off: door_raise
      - switch.turn_off: door_lower
    # never run the motor longer than this, e.g. if the door jams
    max_duration: ${door_motor_active_seconds}

sensor:
  - platform: dht
    model: DHT22
    pin: ${dht_pin}
    temperature:
      name: Temperature
    humidity:
      name: Humidity
    update_interval: ${publish_interval}

  # Raw 0-1024 reading, as on the old firmware (reporting only, no automation).
  - platform: adc
    pin: A0
    raw: true
    name: Luminosity
    update_interval: 1s
    state_class: measurement
    filters:
      - throttle_average: ${publish_interval}

  - platform: uptime
    name: Uptime

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
