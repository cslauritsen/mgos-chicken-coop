# ESPHome port of the Mongoose OS chicken coop firmware (see ../README.md for wiring).
# Hardware: ESP8266 LoLin NodeMCU, DHT22, LDR on A0, two reed switches, H-bridge motor.
substitutions:
  name: chicken-coop
  friendly_name: Chicken Coop
  # pins (same as mos.yml defaults)
  dht_pin: GPIO0
  door_open_contact_pin: GPIO13
  door_closed_contact_pin: GPIO12
  door_raise_pin: GPIO4
  door_lower_pin: GPIO5
  # behaviour (same as mos.yml defaults)
  door_motor_active_seconds: 10s   # time.door_motor_active_seconds: motor run-time backstop
  light_trigger_min_hours: "5"     # time.light_trigger_min_hours
  light_open_threshold: "300"      # luminosity.openThreshold: raw ADC (0-1024) at or below -> open
  light_close_threshold: "900"     # luminosity.closeThreshold: raw ADC (0-1024) at or above -> close
  publish_interval: 60s            # time.mqttPubInterval

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: nodemcuv2

logger:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Same broker as the old firmware. Home Assistant discovery is on by default
# (prefix `homeassistant`). To use the native HA API instead, add `api:` and
# drop this block.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password

# Replaces the /rpc/NorthDoor.Open|Close HTTP calls, e.g.
#   curl -X POST http://<ip>/cover/north_door/open
web_server:
  port: 80

globals:
  # millis() of the last light-triggered move
  - id: last_light_trigger
    type: uint32_t
    initial_value: "0"
  # false until the first light-triggered move after boot
  - id: has_light_triggered
    type: bool
    initial_value: "false"

switch:
  # Motor H-bridge. Both outputs are forced LOW on boot and may never be HIGH
  # together (interlock turns the other one off first).
  - platform: gpio
    id: door_raise
    pin: ${door_raise_pin}
    restore_mode: ALWAYS_OFF
    interlock: [door_lower]
    internal: true
  - platform: gpio
    id: door_lower
    pin: ${door_lower_pin}
    restore_mode: ALWAYS_OFF
    interlock: [door_raise]
    internal: true

binary_sensor:
  # Reed switches are wired to ground with pull-ups: pin LOW == contact made.
  - platform: gpio
    id: door_open_contact
    name: North Door Fully Open
    pin:
      number: ${door_open_contact_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
  - platform: gpio
    id: door_closed_contact
    name: North Door Fully Closed
    pin:
      number: ${door_closed_contact_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms

cover:
  - platform: endstop
    id: north_door
    name: North Door
    device_class: door
    open_action:
      - switch.turn_on: door_raise
    open_endstop: door_open_contact
    open_duration: ${door_motor_active_seconds}
    close_action:
      - switch.turn_on: door_lower
    close_endstop: door_closed_contact
    close_duration: ${door_motor_active_seconds}
    stop_action:
      - switch.turn_off: door_raise
      - switch.turn_off: door_lower
    # never run the motor longer than this, e.g. if the door jams
    max_duration: ${door_motor_active_seconds}

sensor:
  - platform: dht
    model: DHT22
    pin: ${dht_pin}
    temperature:
      name: Temperature
    humidity:
      name: Humidity
    update_interval: ${publish_interval}

  # Raw 0-1024 reading, so the thresholds match the old firmware.
  - platform: adc
    pin: A0
    raw: true
    name: Luminosity
    update_interval: 1s
    state_class: measurement
    filters:
      - throttle_average: ${publish_interval}
    # Auto open/close on light, at most once per light_trigger_min_hours.
    on_raw_value:
      then:
        - lambda: |-
            const uint32_t min_ms = ${light_trigger_min_hours} * 3600UL * 1000UL;
            if (id(has_light_triggered) && (millis() - id(last_light_trigger)) < min_ms)
              return;
            auto &door = id(north_door);
            if (x <= ${light_open_threshold} && door.position == cover::COVER_CLOSED) {
              ESP_LOGI("coop", "Opening door, luminosity %.0f", x);
              door.make_call().set_command_open().perform();
            } else if (x >= ${light_close_threshold} && door.position == cover::COVER_OPEN) {
              ESP_LOGI("coop", "Closing door, luminosity %.0f", x);
              door.make_call().set_command_close().perform();
            } else {
              return;
            }
            id(last_light_trigger) = millis();
            id(has_light_triggered) = true;

  - platform: uptime
    name: Uptime

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

button:
  # was NorthDoor.ResetLightTrigger
  - platform: template
    name: Reset Light Trigger
    on_press:
      - lambda: id(has_light_triggered) = false;
